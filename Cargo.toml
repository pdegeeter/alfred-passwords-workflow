[package]
name = "alfred-passwords"
version = "0.1.0"
edition = "2021"
description = "Alfred workflow to search, copy and generate Apple Passwords entries through apw"
license = "MIT"
repository = "https://github.com/pdegeeter/alfred-passwords-workflow"
publish = false

[[bin]]
name = "alfred-passwords"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
powerpack = "0.8"
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Optimize the binary that ships inside the .alfredworkflow: small and fast to
# start, since Alfred invokes it on every keystroke.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
